name: Building and deploying Springcraft

on:
  release:
    types:
      - published
  workflow_dispatch: {}

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install poetry
        run: pip install poetry
      - name: Build sdist
        run: poetry build --format sdist
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an Intel runner, macos-14 is Apple silicon
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
            macos-15-intel,
            macos-14,
          ]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v3.4.1
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-doc:
    name: Building documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment-docs.yml
          activate-environment: springcraft-docs
          auto-activate: false
          mamba-version: "*"
      - name: Installing Springcraft
        run: pip install .
      - name: Building documentation
        run: sphinx-build doc build/doc
      - name: Zipping documentation
        run: cd build; zip -r doc.zip doc; cd ..
      - uses: actions/upload-artifact@v7
        with:
          name: release-doc
          path: build/doc.zip
          if-no-files-found: error

  upload-package:
    name: Upload package to GitHub Releases & PyPI
    permissions:
      contents: write
      id-token: write
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/project/springcraft/
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: List distributions to be uploaded
        run: ls dist
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2.0.5
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          files: dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'release' && github.event.action == 'published'
