name: Building and deploying Springcraft

on:
  release:
    types:
      - published
  workflow_dispatch: {}

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Build sdist
        run: poetry build --format sdist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Build on Linux, Windows, and macOS (Intel & Apple Silicon)
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-doc:
    name: Building documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: springcraft-dev
          auto-update-conda: true
          python-version: "3.12"
          environment-file: environment.yml
          mamba-version: "*"
      - name: Installing Springcraft
        run: pip install .
      - name: Building documentation
        run: sphinx-build ./doc ./build/doc
      - name: Zipping documentation
        run: cd ./build; zip -r doc.zip doc; cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: release-doc
          path: build/doc.zip
          if-no-files-found: error

  upload-package:
    name: Upload package to GitHub Releases & PyPI
    permissions:
      contents: write
      id-token: write
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/project/springcraft/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: List distributions to be uploaded
        run: ls dist
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2.0.5
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          files: dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'release' && github.event.action == 'published'